name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - name: Swift version
        run: swift --version

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install tools
        run: make install

      - name: Build, lint and test
        run: make build
